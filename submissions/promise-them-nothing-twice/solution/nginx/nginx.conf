worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ── Upstream — three app nodes, round-robin (nginx default) ────────────────
  # Docker Compose service names resolve via Docker's internal DNS.
  upstream relay_nodes {
    server app1:3000;
    server app2:3000;
    server app3:3000;
  }

  server {
    listen 80;
    server_name _;

    # Pass all requests to the round-robin pool
    location / {
      proxy_pass         http://relay_nodes;
      proxy_http_version 1.1;

      # Forward the real client IP and customer ID unchanged
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

      # Forward X-Customer-Id as-is (trusted from gateway per platform context)
      proxy_pass_header  X-Customer-Id;

      # Expose rate-limit and node headers back to the caller
      proxy_pass_header  X-RateLimit-Limit;
      proxy_pass_header  X-RateLimit-Remaining;
      proxy_pass_header  X-RateLimit-Window;
      proxy_pass_header  X-Served-By;
      proxy_pass_header  Retry-After;
    }

    # Health check for the LB itself (does not proxy to nodes)
    location /nginx-health {
      access_log off;
      return 200 "nginx ok\n";
      add_header Content-Type text/plain;
    }
  }
}
